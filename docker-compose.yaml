services:
  postgres:
    image: postgres:16-alpine
    container_name: slack-clone-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: slack_user
      POSTGRES_PASSWORD: slack_password
      POSTGRES_DB: slack_clone
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: slack-clone-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: